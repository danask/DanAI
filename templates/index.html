<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angela's AI Agent</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2>Angela's AI Agent</h2>
            <select id="taskType">
                <option value="general">General Agent</option>
                <option value="code_review">Code Reviewer</option>
                <option value="summarize">Summarizer</option>
                <option value="english">English Tutor</option>
            </select>
            <button id="reviewBtn" onclick="reviewMistakes()">복습하기</button>
        </div>
        <div class="chat-box" id="chatBox"></div>
        <div class="input-area">
            <input type="text" id="promptInput" placeholder="메시지를 입력하세요..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button id="sendBtn" onclick="sendMessage()">전송</button>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
